<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="خيال — منصة عربية لمشاركة برومبتات الذكاء الاصطناعي">
<title>خيال — برومبتات الذكاء الاصطناعي بالعربية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="//khyal-app.vercel.app">

  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">

<!-- ═══════ Critical CSS — يُحمّل فورًا ═══════ -->
<style>
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:'IBM Plex Sans Arabic','Inter',ui-sans-serif,system-ui,sans-serif;
  background:#fff;color:#0f0f0f;
  font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:500;line-height:1.25}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0}
::selection{background:#fcddcc;color:#0f0f0f}

.app{max-width:1240px;margin:0 auto;padding:92px 20px 0}
@media(max-width:720px){.app{padding:88px 16px 110px}}

.topbar{
  position:fixed;top:12px;inset-inline:12px;z-index:60;
  border-radius:24px;
  background:rgba(255,255,255,.72);
  backdrop-filter:saturate(200%) blur(28px);
  -webkit-backdrop-filter:saturate(200%) blur(28px);
  border:1px solid rgba(236,236,239,.7);
  box-shadow:0 10px 40px -12px rgba(15,15,15,.14),0 0 0 1px rgba(236,236,239,.8);
}
.topbar-inner{
  max-width:1240px;margin:0 auto;height:64px;padding:0 18px;
  display:flex;align-items:center;gap:12px
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border:1px solid transparent;border-radius:999px;
  font-size:14px;font-weight:500;padding:11px 20px;line-height:1;
  transition:all .25s cubic-bezier(.22,.61,.36,1);
  white-space:nowrap;position:relative;overflow:hidden
}
.btn-primary{
  background:linear-gradient(135deg,#ff4d00 0%,#e64500 100%);
  color:#fff;
  box-shadow:0 4px 14px -4px rgba(255,77,0,.35)
}

.bottomnav{
  position:fixed;bottom:16px;inset-inline:12px;z-index:70;
  border-radius:28px;
  background:rgba(255,255,255,.82);
  backdrop-filter:saturate(200%) blur(28px);
  -webkit-backdrop-filter:saturate(200%) blur(28px);
  border:1px solid rgba(236,236,239,.7);
  box-shadow:0 10px 40px -12px rgba(15,15,15,.14),0 0 0 1px rgba(236,236,239,.8);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  display:none;max-width:480px;margin:0 auto
}
@media(max-width:720px){.bottomnav{display:block}}

.section{margin:72px 0}
.grid-cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
  gap:20px
}
@media(max-width:720px){.grid-cards{grid-template-columns:1fr;gap:14px}}

.prompt-card{
  display:flex;flex-direction:column;
  background:#fff;border:1px solid #ececef;
  border-radius:20px;overflow:hidden;
  box-shadow:0 1px 2px rgba(15,15,15,.03),0 4px 12px -4px rgba(15,15,15,.04);
  transition:all .4s cubic-bezier(.22,.61,.36,1)
}

.sk{
  background:linear-gradient(90deg,#fafafa 0%,#f0f0f0 30%,#fafafa 50%,#f0f0f0 70%,#fafafa 100%);
  background-size:300% 100%;
  animation:sk-wave 2s ease-in-out infinite;
  border-radius:10px;overflow:hidden
}
@keyframes sk-wave{
  0%{background-position:150% 0}
  100%{background-position:-150% 0}
}
.sk-cover{aspect-ratio:16/10;border-radius:14px}

.state{
  text-align:center;padding:72px 24px;
  border:1.5px dashed #ececef;border-radius:20px;background:#fafafa
}
.spinner{
  width:24px;height:24px;border-radius:999px;
  border:2.5px solid #ececef;border-top-color:#ff4d00;
  animation:spin .8s linear infinite;margin:0 auto
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<link rel="preload" as="style" href="/css/style.css?v=6">
<link rel="stylesheet" href="/css/style.css?v=6" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="/css/style.css?v=6"></noscript>
</head>
<body>

<div id="offline-strip" class="offline-strip" hidden>
  <span class="dot"></span> لا يوجد اتصال بالإنترنت
</div>

<header id="topbar" class="topbar"></header>
<main id="app" class="app">
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px">
    <div class="sk sk-cover" style="height:280px;border-radius:20px"></div>
    <div class="sk sk-cover" style="height:280px;border-radius:20px"></div>
    <div class="sk sk-cover" style="height:280px;border-radius:20px"></div>
  </div>
</main>
<nav id="bottomnav" class="bottomnav"></nav>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js?v=6"></script>
</body>
</html>
