<style>
:root{
--orange:#ff4d00;--orange-dark:#e64500;--orange-soft:#fff5f1;--orange-tint:#ffe9e0;
--glow:#fcddcc;
--ink:#0f0f0f;--slate:#5a5a5a;--ash:#8a8a8a;--stone:#c7c7c7;
--mist:#ececef;--vellum:#fafafa;--paper:#fff;
--grid:#ececef;
--font-sans:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
--font-mono:'JetBrains Mono',ui-monospace,monospace;
--r-pill:999px;--r-card:18px;--r-inner:14px;--r-input:12px;
--ease:cubic-bezier(.22,.61,.36,1);
--topbar-h:60px;
--shadow-sm: 0 1px 2px rgba(15,15,15,.04), 0 2px 8px -2px rgba(15,15,15,.06);
}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;height:100%;scroll-behavior:smooth}
body{
font-family:var(--font-sans);background:var(--paper);color:var(--ink);
font-size:14.5px;line-height:1.6;
-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.015em}
p{margin:0}a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
::selection{background:var(--glow);color:var(--ink)}
.layout{display:flex;min-height:100vh;max-width:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100vh;padding-top:var(--topbar-h)}
.app{flex:1;width:100%;max-width:1440px;margin:0 auto;padding:20px 24px 56px}
@media(max-width:1023px){.app{padding:16px 16px 88px}}
@media(max-width:640px){.app{padding:12px 14px calc(84px + env(safe-area-inset-bottom, 0px))}}
.sidebar{
width:260px;flex-shrink:0;background:var(--paper);
border-inline-start:1px solid var(--grid);
position:sticky;top:0;height:100vh;overflow-y:auto;display:none;z-index:40;
}
@media(min-width:1024px){.sidebar{display:block}}
.sidebar-inner{padding:20px 16px 24px;display:flex;flex-direction:column;min-height:100%}
.topbar{
position:fixed;top:0;inset-inline:0;height:var(--topbar-h);
background:rgba(255,255,255,.92);
backdrop-filter:saturate(180%) blur(24px);
-webkit-backdrop-filter:saturate(180%) blur(24px);
border-bottom:1px solid var(--grid);z-index:50;
}
@media(min-width:1024px){.topbar{inset-inline-start:260px;inset-inline-end:0}}
.bottomnav{
position:fixed;bottom:0;inset-inline:0;z-index:60;
background:rgba(255,255,255,.94);
backdrop-filter:saturate(180%) blur(24px);
-webkit-backdrop-filter:saturate(180%) blur(24px);
border-top:1px solid var(--grid);
padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));
display:none;
}
@media(max-width:1023px){.bottomnav{display:block}}
.sk{
background:linear-gradient(90deg,#fafafa 0%,#f0f0f0 40%,#fafafa 80%);
background-size:200% 100%;animation:sk-wave 1.8s ease-in-out infinite;
border-radius:12px;overflow:hidden;
}
@keyframes sk-wave{0%{background-position:150% 0}100%{background-position:-150% 0}}
.spinner{
width:22px;height:22px;border-radius:999px;
border:2.5px solid var(--mist);border-top-color:var(--orange);
animation:spin .7s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
