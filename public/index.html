  <meta name="theme-color" content="#0a0a0f">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:;">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <!-- Loading Screen -->
  <div id="loading-screen" class="loading-screen">
    <div class="loading-content">
      <div class="loading-logo">🔥</div>
      <h1 class="loading-title">خيال</h1>
      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>
    </div>
  </div>

  <!-- Offline Strip -->
  <div id="offline-strip" class="offline-strip" hidden>
    <span class="offline-icon"></span>
    <span>أنت غير متصل بالإنترنت</span>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="القائمة الرئيسية">
      <div class="sidebar-inner">
        <div class="sidebar-brand">
          <div class="brand-icon">🔥</div>
          <div class="brand-text">
            <span class="brand-name">خيال</span>
            <span class="brand-tag">AI Prompts</span>
          </div>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>

    <div class="main">

      <header id="topbar" class="topbar" role="banner"></header>
      
      <!-- Route Loading Indicator -->
      <div id="route-loading" class="route-loading" hidden>
        <div class="route-loading-bar"></div>
      </div>

      <!-- Main App Container -->
      <main id="app" class="app" role="main"></main>

      <!-- Footer -->
      <footer class="site-footer" id="site-footer" role="contentinfo"></footer>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottomnav" class="bottomnav" aria-label="التنقل السفلي"></nav>

  <!-- Toasts Container -->
  <div id="toasts" class="toasts"></div>

  <!-- Script -->
  <script type="module" src="/js/app.js?v=9"></script>

</html>
