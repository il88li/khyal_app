<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="خيال — منصة عربية لمشاركة برومبتات الذكاء الاصطناعي">
  <meta name="theme-color" content="#ffffff">
  
  <!-- Content Security Policy: يسمح بالـ modules والـ inline styles فقط -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:;">
  
  <title>خيال | برومبتات عربية للذكاء الاصطناعي</title>
  
  <!-- Favicon (SVG inline - لا يحتاج ملف خارجي) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%3C/text%3E%3C/svg%3E">
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  
  <!-- CSS -->
  <link rel="stylesheet" href="/css/style.css?v=8">
</head>
<body>
  <!-- Offline Strip -->
  <div id="offline-strip" class="offline-strip" hidden>
    <span class="dot"></span>
    <span>أنت غير متصل بالإنترنت</span>
  </div>

  <div class="layout">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar" aria-label="القائمة الرئيسية">
      <div class="sidebar-inner">
        <div class="sidebar-brand">
          <span>🔥</span>
          <span>خيال</span>
        </div>
        <nav id="sidebar-nav" class="sidebar-nav"></nav>
        <div id="sidebar-foot" class="sidebar-foot"></div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main">
      <!-- Topbar -->
      <header id="topbar" class="topbar" role="banner"></header>
      
      <!-- Route Loading Indicator -->
      <div id="route-loading" class="route-loading" hidden>
        <div class="route-loading-bar"></div>
      </div>

      <!-- Main App Container -->
      <main id="app" class="app" role="main"></main>

      <!-- Footer -->
      <footer class="site-footer" id="site-footer" role="contentinfo"></footer>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav id="bottomnav" class="bottomnav" aria-label="التنقل السفلي"></nav>

  <!-- Toasts Container -->
  <div id="toasts" class="toasts"></div>

  <!-- Script (بدون defer مع type=module) -->
  <script type="module" src="/js/app.js?v=8"></script>
</body>
</html>
