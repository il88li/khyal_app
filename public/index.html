<!-- ═══════ Critical CSS (يُحمّل فورًا) ═══════ -->
<style>
:root{
  --orange:#ff4d00;--orange-dark:#e64500;--orange-soft:#fff5f1;--orange-tint:#ffe9e0;
  --glow:#fcddcc;
  --ink:#0f0f0f;--slate:#5a5a5a;--ash:#8a8a8a;--stone:#c7c7c7;
  --mist:#ececef;--vellum:#fafafa;--paper:#fff;
  --grid:#ececef;
  --font-sans:'IBM Plex Sans Arabic',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
  --r-pill:999px;--r-card:20px;--r-inner:14px;--r-input:12px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --topbar-h:64px;--sidebar-w:260px;--bottombar-h:68px;
  --shadow-sm:0 1px 2px rgba(15,15,15,.04),0 2px 8px -2px rgba(15,15,15,.06);
  --shadow-md:0 2px 4px rgba(15,15,15,.04),0 8px 24px -8px rgba(15,15,15,.10);
  --shadow-lg:0 4px 8px rgba(15,15,15,.04),0 16px 40px -12px rgba(15,15,15,.14);
}
*{-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  height:100%;scroll-behavior:smooth;
  overflow-x:hidden;
}
body{
  font-family:var(--font-sans);
  background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  min-height:100vh;
  overflow-x:hidden;
  overscroll-behavior-y:none;
}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.015em}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;color:inherit}
input,textarea,select{font-family:inherit}
::selection{background:var(--glow);color:var(--ink)}

/* Skeleton */
.sk{
  background:linear-gradient(90deg,#fafafa 0%,#f0f0f0 40%,#fafafa 80%);
  background-size:200% 100%;
  animation:sk-wave 1.8s ease-in-out infinite;
  border-radius:12px;overflow:hidden;
}
@keyframes sk-wave{
  0%{background-position:150% 0}
  100%{background-position:-150% 0}
}
.spinner{
  width:24px;height:24px;border-radius:999px;
  border:2.5px solid var(--mist);border-top-color:var(--orange);
  animation:spin .7s linear infinite;margin:0 auto;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<link rel="preload" as="style" href="/css/style.css?v=7">

</head>
<body>

<div id="offline-strip" class="offline-strip" hidden>
  <span class="dot"></span>
  <span>لا يوجد اتصال بالإنترنت</span>
</div>

<!-- ═══ Layout wrapper ═══ -->
<div class="layout">

  <!-- ─── Desktop Sidebar ─── -->
  <aside id="sidebar" class="sidebar" aria-label="القائمة الرئيسية">
    <div class="sidebar-inner">
      <a class="sidebar-brand" href="#/">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 2.5c.6 3.6 3 5 4.7 6.9A6.7 6.7 0 0 1 18.6 14a6.6 6.6 0 0 1-13.2 0c0-2.2 1-3.7 2.3-5.1.5 1 1.2 1.7 2 2-.4-3 .8-6 2.3-8.4Z" fill="#ff4d00"/>
          <path d="M12 21a3 3 0 0 0 3-3c0-1.6-1.2-2.6-3-4.4-1.8 1.8-3 2.8-3 4.4a3 3 0 0 0 3 3Z" fill="#fcddcc"/>
        </svg>
        <span>خيال</span>
      </a>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </div>
  </aside>

  <!-- ─── Main ─── -->
  <div class="main">

    <!-- Topbar -->
    <header id="topbar" class="topbar"></header>

    <!-- Content -->
    <main id="app" class="app">
      <div class="app-skeleton">
        <div class="sk" style="height:180px;border-radius:20px"></div>
        <div class="sk" style="height:320px;border-radius:20px"></div>
        <div class="sk" style="height:320px;border-radius:20px"></div>
      </div>
    </main>

    <!-- Footer (desktop) -->
    <footer class="site-footer" id="site-footer"></footer>

  </div>
</div>

<!-- ═══ Mobile Bottom Nav ═══ -->
<nav id="bottomnav" class="bottomnav" aria-label="التنقل السفلي"></nav>

<!-- ═══ Toasts ═══ -->
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<!-- ═══ Loading indicator ═══ -->
<div id="route-loading" class="route-loading" hidden>
  <div class="route-loading-bar"></div>
</div>

<script type="module" src="/js/app.js?v=7"></script>
</body>
</html>
