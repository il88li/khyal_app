<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="خيال — منصة عربية لمشاركة برومبتات الذكاء الاصطناعي">
<title>خيال — برومبتات الذكاء الاصطناعي بالعربية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- شريط انقطاع الاتصال -->
<div id="offline-strip" class="offline-strip" hidden>
  <span class="dot"></span> لا يوجد اتصال بالإنترنت
</div>

<!-- الشريط العلوي الثابت -->
<header id="topbar" class="topbar"></header>

<!-- منطقة عرض الشاشات -->
<main id="app" class="app"></main>

<!-- الشريط السفلي العائم (الجوال) -->
<nav id="bottomnav" class="bottomnav"></nav>

<!-- مؤشر صحة قاعدة البيانات -->
<div id="db-status" class="db-status" title="حالة الاتصال بقاعدة البيانات">
  <span class="dot"></span>
  <span class="txt mono">DB</span>
</div>

<!-- حاوية التنبيهات -->
<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
